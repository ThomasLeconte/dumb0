name: Deploy to Dockerhub

on:
  push:
    branches:


jobs:
  build:
    runs-on: ubuntu-latest
    #    environment: PROD
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: src/Dockerfile
          push: true
          tags: thomasleconte/dumb0:latest
          build-args: VITE_PRIMEVUE_LICENCE_KEY=${{secrets.VITE_PRIMEVUE_LICENCE_KEY}}