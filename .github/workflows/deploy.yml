name: Deploy to Dockerhub

on:
  push:
    branches:
      - deploy

jobs:
  build-docker-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: src/Dockerfile
          push: true
          tags: thomasleconte/dumb0:latest
          build-args: VITE_PRIMEVUE_LICENCE_KEY=${{secrets.VITE_PRIMEVUE_LICENCE_KEY}}

  build-github-container-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/ThomasLeconte
          username: ${{ secrets.GCR_USERNAME }}
          password: ${{ secrets.GCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: src/Dockerfile
          push: true
          tags: ghcr.io/thomasleconte/dumb0:latest
          build-args: |
            VITE_PRIMEVUE_LICENCE_KEY=${{secrets.VITE_PRIMEVUE_LICENCE_KEY}}
            VITE_POSTHOG_KEY=${{secrets.POSTHOG_KEY}}
